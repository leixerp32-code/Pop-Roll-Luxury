<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enterprise Cannabis Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter;background:#0b0f14;color:#fff}
button{cursor:pointer;border:none;border-radius:10px;padding:.6rem 1rem;background:#2fd08f;font-weight:700}
input,select{background:#101622;border:1px solid #333;color:#fff;padding:.5rem;border-radius:8px}
nav{position:sticky;top:0;z-index:1000;background:#0e131b;padding:1rem 2rem;display:flex;justify-content:space-between}
section{padding:2rem}
.card{background:#141b26;border-radius:18px;padding:1.2rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem}
footer{background:#0e131b;padding:3rem;margin-top:4rem}
a{color:#2fd08f;text-decoration:none}
.hidden{display:none}
</style>
</head>

<body>

<nav>
  <b>Premium Cannabis Platform</b>
  <div id="nav"></div>
</nav>

<section id="app"></section>

<!-- ====================== MUNCHIES BUTTON ====================== -->
<div id="munchiesBtn"
style="position:fixed;bottom:90px;right:20px;padding:14px 22px;
background:linear-gradient(135deg,#ffb347,#ff7b00);
border-radius:40px;font-weight:800;color:#000;
box-shadow:0 0 25px rgba(255,120,0,.9);
z-index:999;cursor:pointer"
onclick="openMunchies()">
All My Munchies
</div>

<!-- ====================== AVATAR ====================== -->
<div id="avatar"
style="position:fixed;bottom:20px;right:20px;z-index:9999">
<button onclick="toggleAvatar()">Budtender</button>
<div id="avatarPanel" class="card hidden" style="width:300px;height:420px;display:flex;flex-direction:column">
<b>Budtender Assistant</b>
<select id="alang">
<option value="en">English</option>
<option value="fr">Français</option>
<option value="es">Español</option>
<option value="hi">हिंदी</option>
</select>
<div id="achat" style="flex:1;overflow:auto;margin:10px 0"></div>
<input id="ainput" placeholder="Ask about THC, deals, points">
<button onclick="ask()">Send</button>
</div>
</div>

<footer>
<div class="grid">
<div>
<h4>Store</h4>
<p><a href="tel:+14165551234">+1 416-555-1234</a></p>
<p><a href="mailto:info@dispensary.com">info@dispensary.com</a></p>
<p>123 Cannabis Ave, Toronto</p>
<p>10:00 – 23:00</p>
</div>

<div>
<h4>Legal</h4>
<a onclick="legal('terms')">Terms</a><br>
<a onclick="legal('privacy')">Privacy</a><br>
<a onclick="legal('delivery')">Delivery Policy</a><br>
<a onclick="legal('loyalty')">Loyalty Terms</a><br>
<a onclick="legal('disclaimer')">Cannabis Disclaimer</a>
</div>

<div>
<h4>Social</h4>
<a href="https://instagram.com" target="_blank">Instagram</a><br>
<a href="https://facebook.com" target="_blank">Facebook</a><br>
<a href="https://tiktok.com" target="_blank">TikTok</a><br>
<a href="https://twitter.com" target="_blank">X</a>
</div>
</div>
</footer>

<script>
/* ====================== STORAGE ====================== */
const LS=(k,v)=>v!==undefined?localStorage.setItem(k,JSON.stringify(v)):JSON.parse(localStorage.getItem(k));

let users=LS("users")||[];
let session=LS("session");
let chats=LS("chats")||[];

/* ====================== PRODUCTS ====================== */
const products=[
{id:"p1",name:"OG Kush",type:"Indica",thc:22,price:32},
{id:"p2",name:"Blue Dream",type:"Hybrid",thc:19,price:30},
{id:"p3",name:"Sour Diesel",type:"Sativa",thc:24,price:34}
];

/* ====================== SNACKS ====================== */
const snacks=[
{id:"s1",name:"Chips",price:5,points:5},
{id:"s2",name:"Chocolate",price:6,points:6},
{id:"s3",name:"Combo Box",price:35,points:50}
];

/* ====================== NAV ====================== */
function renderNav(){
nav.innerHTML=session
? `${session.email} | Points ${session.points}
<button onclick="logout()">Logout</button>`
: `<button onclick="loginView()">Login</button>
<button onclick="registerView()">Register</button>`;
}

/* ====================== AUTH ====================== */
function registerView(){
app.innerHTML=`
<h2>Create Account</h2>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="register()">Register</button>`;
}

function register(){
const u={id:crypto.randomUUID(),email:email.value,pass:pass.value,points:0,orders:[]};
users.push(u);
LS("users",users);
session=u;
LS("session",u);
render();
}

function loginView(){
app.innerHTML=`
<h2>Login</h2>
<input id="email"><br>
<input id="pass" type="password"><br>
<button onclick="login()">Login</button>`;
}

function login(){
const u=users.find(x=>x.email===email.value&&x.pass===pass.value);
if(!u)return alert("Invalid");
session=u;
LS("session",u);
render();
}

function logout(){session=null;LS("session",null);render();}

/* ====================== SHOP ====================== */
function shop(){
app.innerHTML=`
<h2>Cannabis Menu</h2>
<div class="grid">
${products.map(p=>`
<div class="card">
<h3>${p.name}</h3>
<p>${p.type}</p>
<p>THC ${p.thc}%</p>
<p>$${p.price}</p>
<button onclick="buy('${p.id}',${p.price})">Add</button>
</div>`).join("")}
</div>`;
}

/* ====================== PURCHASE ====================== */
function buy(id,price){
session.points+=price;
session.orders.push({id:"ORD"+Date.now(),total:price,status:"Delivered"});
LS("session",session);
render();
}

/* ====================== DASHBOARD ====================== */
function dashboard(){
app.innerHTML=`
<h2>Account</h2>
<div class="card">
<p>Email: ${session.email}</p>
<p>Points: ${session.points}</p>
</div>

<div class="card">
<h3>Orders</h3>
${session.orders.map(o=>`<p>${o.id} – $${o.total}</p>`).join("")}
</div>

<button onclick="shop()">Shop Cannabis</button>`;
}

/* ====================== CHAT ====================== */
function chat(){
app.innerHTML=`
<h2>Chat</h2>
<div class="card" id="chatBox" style="height:300px;overflow:auto"></div>
<input id="msg">
<button onclick="send()">Send</button>`;
}

function send(){
chats.push({user:session.email,text:msg.value});
LS("chats",chats);
msg.value="";
renderChat();
}

function renderChat(){
const box=document.getElementById("chatBox");
if(!box)return;
box.innerHTML=chats.map(c=>`<p><b>${c.user}:</b> ${c.text}</p>`).join("");
}

/* ====================== MUNCHIES ====================== */
function openMunchies(){
app.innerHTML=`
<h2>All My Munchies</h2>
<div class="grid">
${snacks.map(s=>`
<div class="card">
<h3>${s.name}</h3>
<p>$${s.price}</p>
<p>Earn ${s.points} points</p>
<button onclick="buySnack(${s.points})">Add</button>
</div>`).join("")}
</div>
<button onclick="render()">Back</button>`;
}

function buySnack(p){
session.points+=p;
LS("session",session);
render();
}

/* ====================== LEGAL ====================== */
function legal(t){
const pages={
terms:"Terms of Service",
privacy:"Privacy Policy",
delivery:"Delivery requires valid ID.",
loyalty:"Points have no cash value.",
disclaimer:"For adults 19+ only."
};
app.innerHTML=`<button onclick="render()">Back</button><div class="card">${pages[t]}</div>`;
}

/* ====================== AVATAR ====================== */
function toggleAvatar(){
avatarPanel.classList.toggle("hidden");
}

function ask(){
const q=ainput.value.toLowerCase();
achat.innerHTML+=`<p><b>You:</b> ${q}</p>`;
let r="I can explain THC, CBD, points, deals, delivery.";
if(q.includes("thc")) r="THC causes psychoactive effects.";
if(q.includes("cbd")) r="CBD is non-intoxicating.";
if(q.includes("points")) r=`You have ${session?.points||0} points.`;
achat.innerHTML+=`<p><b>Budtender:</b> ${r}</p>`;
ainput.value="";
achat.scrollTop=achat.scrollHeight;
}

/* ====================== RENDER ====================== */
function render(){
renderNav();
if(!session) shop();
else dashboard();
}

render();
</script>

</body>
</html>
