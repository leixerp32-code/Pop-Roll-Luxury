<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enterprise Cannabis Dispensary Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ======================================================
   GLOBAL RESET
====================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, system-ui, sans-serif;
}

body {
  background: #0b0f14;
  color: #e5e7eb;
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }

button {
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
}

/* ======================================================
   VARIABLES
====================================================== */

:root {
  --bg: #0b0f14;
  --panel: #111827;
  --card: #0f172a;
  --accent: #22c55e;
  --accent2: #2dd4bf;
  --danger: #ef4444;
  --text-muted: #9ca3af;
  --radius: 14px;
}

/* ======================================================
   LAYOUT
====================================================== */

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(10,14,20,.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
}

.logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .5px;
  color: var(--accent);
}

.nav-right {
  display: flex;
  gap: 18px;
  align-items: center;
}

.nav-btn {
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.04);
}

.nav-btn:hover {
  background: rgba(255,255,255,.08);
}

/* ======================================================
   HERO
====================================================== */

.hero {
  height: 90vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .35;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 900px;
}

.hero h1 {
  font-size: clamp(2.5rem,6vw,4.5rem);
  font-weight: 800;
  margin-bottom: 20px;
}

.hero-actions {
  display: flex;
  justify-content: center;
  gap: 18px;
}

.hero-actions button {
  padding: 14px 28px;
  border-radius: 40px;
  font-size: 16px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: #022c22;
  font-weight: 700;
}

/* ======================================================
   SECTIONS
====================================================== */

.section {
  padding: 80px 40px;
}

.section-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 30px;
}

/* ======================================================
   CARDS
====================================================== */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 24px;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  transition: .25s;
  border: 1px solid rgba(255,255,255,.04);
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 12px;
}

.card h4 {
  font-size: 16px;
  margin-bottom: 4px;
}

.muted {
  color: var(--text-muted);
  font-size: 13px;
}

/* ======================================================
   MODALS
====================================================== */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal-box {
  background: var(--panel);
  padding: 40px;
  border-radius: 20px;
  width: 90%;
  max-width: 520px;
  text-align: center;
}

/* ======================================================
   CHAT
====================================================== */

.chat-box {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 340px;
  height: 480px;
  background: var(--panel);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 3000;
}

.chat-header {
  padding: 14px;
  background: #020617;
  font-weight: 600;
}

.chat-messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
}

.chat-input {
  display: flex;
  border-top: 1px solid rgba(255,255,255,.05);
}

.chat-input input {
  flex: 1;
  background: none;
  border: none;
  padding: 12px;
  color: white;
}

.chat-input button {
  padding: 12px 18px;
  background: var(--accent);
  color: #022c22;
  font-weight: 700;
}

/* ======================================================
   FOOTER
====================================================== */

footer {
  background: #020617;
  padding: 60px 40px;
  margin-top: 80px;
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 40px;
}

footer h4 {
  margin-bottom: 14px;
}

footer a {
  display: block;
  margin-bottom: 8px;
  color: var(--text-muted);
}

footer a:hover {
  color: var(--accent);
}

</style>
</head>

<body>

<div id="app">

<header>
  <div class="nav">
    <div class="logo">DISPENSARY</div>
    <div class="nav-right">
      <button class="nav-btn" onclick="openCart()">Cart</button>
      <button class="nav-btn" onclick="openProfile()">Account</button>
    </div>
  </div>
</header>

<!-- AGE GATE -->
<div class="modal" id="ageGate">
  <div class="modal-box">
    <h2>Are you 19+</h2>
    <p class="muted">You must be of legal age to enter.</p>
    <br>
    <button onclick="confirmAge()" style="padding:14px 30px;border-radius:30px;background:var(--accent);font-weight:700;color:#022c22;">Enter</button>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-smoke-flow-8450/1080p.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <h1>Premium Cannabis Delivery</h1>
    <div class="hero-actions">
      <button onclick="loadShop()">Order Cannabis</button>
      <button onclick="loadMunchies()">All My Munchies</button>
    </div>
  </div>
</section>

<section class="section" id="shop"></section>

<footer>
  <div class="footer-grid">
    <div>
      <h4>Store</h4>
      <a href="tel:+14165551234">+1 416 555 1234</a>
      <a href="mailto:info@dispensary.com">info@dispensary.com</a>
      <p class="muted">Toronto, Ontario</p>
    </div>
    <div>
      <h4>Legal</h4>
      <a onclick="openLegal('terms')">Terms</a>
      <a onclick="openLegal('privacy')">Privacy</a>
      <a onclick="openLegal('delivery')">Delivery Policy</a>
    </div>
  </div>
</footer>

</div>

<script>

/* ======================================================
   GLOBAL STATE
====================================================== */

let state = {
  user: null,
  cart: JSON.parse(localStorage.getItem("cart")||"[]"),
  orders: JSON.parse(localStorage.getItem("orders")||"[]"),
  points: Number(localStorage.getItem("points")||0)
};

/* ======================================================
   AGE GATE
====================================================== */

function confirmAge(){
  document.getElementById("ageGate").style.display="none";
}

/* ======================================================
   PRODUCTS DATABASE
====================================================== */

const products = [
  {
    id:1,
    name:"Purple Kush",
    brand:"BC Craft",
    category:"Cannabis",
    sub:"Indica",
    thc:24,
    cbd:1,
    terpenes:["Myrcene","Limonene"],
    effects:["Relaxed","Sleepy"],
    prices:{3.5:32,7:60,15:110,28:190},
    image:"https://images.unsplash.com/photo-1603398938378-e54c65b7c8d6"
  },
  {
    id:2,
    name:"Blue Dream",
    brand:"West Coast",
    category:"Cannabis",
    sub:"Hybrid",
    thc:21,
    cbd:2,
    terpenes:["Pinene","Caryophyllene"],
    effects:["Happy","Creative"],
    prices:{3.5:30,7:55,15:105,28:185},
    image:"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"
  }
];

/* ======================================================
   SHOP
====================================================== */

function loadShop(){
  const el=document.getElementById("shop");
  el.innerHTML=`
    <h2 class="section-title">Trending Products</h2>
    <div class="grid">
      ${products.map(p=>`
        <div class="card">
          <img src="${p.image}" loading="lazy">
          <h4>${p.name}</h4>
          <div class="muted">${p.sub} • THC ${p.thc}%</div>
          <br>
          <select onchange="addToCart(${p.id},this.value)">
            <option>Select weight</option>
            ${Object.keys(p.prices).map(w=>`<option value="${w}">${w}g - $${p.prices[w]}</option>`).join("")}
          </select>
        </div>
      `).join("")}
    </div>
  `;
}

/* ======================================================
   CART
====================================================== */

function addToCart(id,weight){
  const product=products.find(p=>p.id===id);
  state.cart.push({
    id,
    weight,
    price:product.prices[weight]
  });
  localStorage.setItem("cart",JSON.stringify(state.cart));
  alert("Added to cart");
}

function openCart(){
  let total=0;
  const items=state.cart.map(i=>{
    total+=i.price;
    return `<div>${i.weight}g — $${i.price}</div>`;
  }).join("");
  alert("Cart:\\n"+items+"\\nTotal: $"+total);
}

/* ======================================================
   PROFILE & POINTS
====================================================== */

function openProfile(){
  alert("Points: "+state.points);
}

/* ======================================================
   LEGAL
====================================================== */

function openLegal(type){
  alert(type.toUpperCase()+" POLICY");
}

/* ======================================================
   MUNCHIES
====================================================== */

function loadMunchies(){
  alert("Munchies marketplace loaded");
}

</script>

</body>
</html>

<script>

/* ======================================================
   ORDER & DELIVERY ENGINE
====================================================== */

let deliveryState = {
  stages: [
    "Received",
    "Preparing",
    "Ready",
    "Picked Up",
    "On Route",
    "Delivered"
  ]
};

function placeOrder() {
  const order = {
    id: Date.now(),
    items: state.cart,
    status: "Received",
    created: new Date().toISOString(),
    pointsEarned: Math.floor(cartTotal()),
    courier: null
  };

  state.orders.push(order);
  state.points += order.pointsEarned;

  localStorage.setItem("orders", JSON.stringify(state.orders));
  localStorage.setItem("points", state.points);
  localStorage.removeItem("cart");
  state.cart = [];

  renderOrderTracking(order.id);
}

function cartTotal() {
  return state.cart.reduce((a, b) => a + b.price, 0);
}

/* ======================================================
   LIVE ORDER TRACKING
====================================================== */

function renderOrderTracking(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  const el = document.getElementById("shop");

  el.innerHTML = `
    <h2 class="section-title">Order Tracking</h2>

    <div class="card">
      <h4>Order #${order.id}</h4>
      <p>Status: <strong id="orderStatus">${order.status}</strong></p>
      <div id="timeline"></div>
      <br>
      <button onclick="advanceOrder(${order.id})">Advance Status</button>
    </div>
  `;

  updateTimeline(order);
}

function updateTimeline(order) {
  const timeline = deliveryState.stages.map(stage => {
    const active = deliveryState.stages.indexOf(stage) <=
      deliveryState.stages.indexOf(order.status);
    return `<div style="margin:6px 0;color:${active ? '#22c55e' : '#6b7280'}">
      ${stage}
    </div>`;
  }).join("");

  document.getElementById("timeline").innerHTML = timeline;
}

function advanceOrder(id) {
  const order = state.orders.find(o => o.id === id);
  let idx = deliveryState.stages.indexOf(order.status);
  if (idx < deliveryState.stages.length - 1) {
    order.status = deliveryState.stages[idx + 1];
    localStorage.setItem("orders", JSON.stringify(state.orders));
    document.getElementById("orderStatus").innerText = order.status;
    updateTimeline(order);
  }
}

/* ======================================================
   LOYALTY TIERS
====================================================== */

function loyaltyTier(points) {
  if (points >= 5000) return "VIP";
  if (points >= 2000) return "Gold";
  if (points >= 500) return "Silver";
  return "Bronze";
}

/* ======================================================
   CHAT SYSTEM (PERSISTENT)
====================================================== */

let chats = JSON.parse(localStorage.getItem("chats") || "[]");

function openChat(channel) {
  if (document.getElementById("chatBox")) return;

  const box = document.createElement("div");
  box.className = "chat-box";
  box.id = "chatBox";

  box.innerHTML = `
    <div class="chat-header">${channel} Chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Type message"/>
      <button onclick="sendChat('${channel}')">Send</button>
    </div>
  `;

  document.body.appendChild(box);
  renderChat(channel);
}

function sendChat(channel) {
  const input = document.getElementById("chatInput");
  if (!input.value) return;

  chats.push({
    channel,
    text: input.value,
    time: new Date().toLocaleTimeString()
  });

  localStorage.setItem("chats", JSON.stringify(chats));
  input.value = "";
  renderChat(channel);
}

function renderChat(channel) {
  const msgs = chats.filter(c => c.channel === channel);
  document.getElementById("chatMessages").innerHTML =
    msgs.map(m =>
      `<div style="margin-bottom:6px">
        <small>${m.time}</small><br>${m.text}
      </div>`
    ).join("");
}

/* ======================================================
   ADMIN PANEL
====================================================== */

function openAdmin() {
  const el = document.getElementById("shop");
  el.innerHTML = `
    <h2 class="section-title">Admin Dashboard</h2>

    <div class="grid">
      <div class="card">
        <h4>Products</h4>
        <button onclick="adminProducts()">Manage</button>
      </div>

      <div class="card">
        <h4>Orders</h4>
        <button onclick="adminOrders()">View</button>
      </div>

      <div class="card">
        <h4>Users</h4>
        <p>Total Points Issued: ${state.points}</p>
      </div>

      <div class="card">
        <h4>Happy Hour</h4>
        <button onclick="toggleHappyHour()">Toggle</button>
      </div>
    </div>
  `;
}

function adminProducts() {
  alert("Product management active");
}

function adminOrders() {
  alert("Orders: " + state.orders.length);
}

/* ======================================================
   HAPPY HOUR
====================================================== */

let happyHour = JSON.parse(localStorage.getItem("happyHour") || "false");

function toggleHappyHour() {
  happyHour = !happyHour;
  localStorage.setItem("happyHour", happyHour);
  alert("Happy Hour: " + (happyHour ? "ON" : "OFF"));
}

/* ======================================================
   MULTI LANGUAGE ENGINE
====================================================== */

const translations = {
  en: { order: "Order Cannabis" },
  es: { order: "Ordenar Cannabis" },
  fr: { order: "Commander Cannabis" },
  hi: { order: "कैनबिस ऑर्डर करें" }
};

let currentLang = "en";

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerText = translations[lang][el.dataset.i18n];
  });
}

/* ======================================================
   AI BUDTENDER AVATAR
====================================================== */

const avatar = document.createElement("div");
avatar.style.position = "fixed";
avatar.style.bottom = "30px";
avatar.style.left = "30px";
avatar.style.width = "70px";
avatar.style.height = "70px";
avatar.style.borderRadius = "50%";
avatar.style.background = "linear-gradient(135deg,#22c55e,#2dd4bf)";
avatar.style.display = "flex";
avatar.style.alignItems = "center";
avatar.style.justifyContent = "center";
avatar.style.fontWeight = "800";
avatar.style.color = "#022c22";
avatar.style.cursor = "pointer";
avatar.innerText = "AI";
avatar.onclick = () => openChat("Budtender");

document.body.appendChild(avatar);

/* ======================================================
   STARTUP
====================================================== */

loadShop();

</script>

</html>
